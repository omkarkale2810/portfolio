<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omkar Kale — Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="refresh" content="0; url=/portfolio/" />
    <script>
      // GitHub Pages single-page-app fallback:
      // preserve any sub-path the visitor was trying to reach.
      (function () {
        var path = window.location.pathname.replace(/^\/portfolio/, '') + window.location.search + window.location.hash;
        window.location.replace('/portfolio/' + path);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; color: #fff; background: #07090d; padding: 24px;">
      Redirecting…
    </p>
  </body>
</html>
